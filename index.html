<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hack The Mainframe (Sort Of)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #1a1a2e;
            color: #e94560;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .game-container {
            background-color: #16213e;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            border: 2px solid #0f3460;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            /* border: 2px solid red; */
        }

        h1 {
            color: #fff;
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.9rem;
            color: #a8a8b3;
            margin-bottom: 20px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #0f3460;
            color: white;
            font-size: 1rem;
            text-align: center;
        }

        input:focus {
            outline: 2px solid #e94560;
        }

        button {
            padding: 10px 20px;
            background-color: #e94560;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #d13d56;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
            min-height: 24px;
            /* stops layout jumping */
        }

        .attempts {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #888;
        }

        /* win screen stuff i just added */
        #winScreen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 999;
            justify-content: center;
            align-items: center;
            color: #4caf50;
            flex-direction: column;
        }
        .win-content {
            background: #16213e;
            padding: 50px;
            border: 4px solid #4caf50;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 0 50px #4caf50;
        }
        .win-content h1 {
            font-size: 4rem;
            margin-bottom: 15px;
        }
        .play-again {
            margin-top: 25px;
            background: #4caf50 !important;
            padding: 15px 30px;
        }
    </style>
</head>

<body>

    <div class="game-container">
        <h1>Guess the Password</h1>
        <p>Hint: It's a 5-letter word related to coding.</p>

        <input type="text" id="guessInput" placeholder="Enter guess..." maxlength="5" autocomplete="off">
        <br>
        <button id="submitBtn" onclick="checkGuess()">Hack It</button>

        <div id="message">System Ready...</div>
        <div class="attempts">Attempts left: <span id="attemptCount">5</span></div>
    </div>

    <!-- win screen popup -->
    <div id="winScreen">
        <div class="win-content">
            <h1>GG!</h1>
            <p style="color: white;">Mainframe Hacked Successfully.</p>
            <button class="play-again" onclick="location.reload()">PLAY AGAIN</button>
        </div>
    </div>

    <script>

        var passwords = ["debug", "array", "pixel", "logic", "query"];

        // pick random
        var secretPassword = passwords[Math.floor(Math.random() * passwords.length)];
        //console.log(secretPassword);

        var maxAttempts = 5;
        var currentAttempts = 0;
        var gameOver = false;

        var inputField = document.getElementById("guessInput");
        var msg = document.getElementById("message");
        var attemptsDisplay = document.getElementById("attemptCount");
        var btn = document.getElementById("submitBtn");

        // enter key
        inputField.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                e.preventDefault();
                checkGuess();
            }
        });


        function checkGuess() {

            if (gameOver) {
                alert("Game over man! Refresh to try again.");
                return;
            }

            var guess = inputField.value.toLowerCase().trim();

            if (guess.length !== 5) {
                msg.innerText = "Bruh, the hint said 5 letters.";
                msg.style.color = "#ffcc00";
                return
            }

            currentAttempts++;
            var left = maxAttempts - currentAttempts;
            attemptsDisplay.innerText = left;

            if (guess === secretPassword) {
                msg.innerText = "Access Granted! You're in.";
                msg.style.color = "#4caf50";
                inputField.disabled = true;
                btn.disabled = true;
                gameOver = true;
                
                // show the win screen
                document.getElementById("winScreen").style.display = "flex";
            } else {
                if (left > 0) {
                    msg.innerText = "Access Denied. Try again.";
                    msg.style.color = "#e94560";
                    inputField.value = "";
                    inputField.focus();
                } else {
                    // rip
                    msg.innerText = "Lockout! The password was: " + secretPassword + ". get rekt.";
                    msg.style.color = "red";
                    inputField.disabled = true;
                    btn.disabled = true;
                    gameOver = true;
                }
            }
        }

        // TODO: play again button maybe later
    </script>
</body>

</html>
